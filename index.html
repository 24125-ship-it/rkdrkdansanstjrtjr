<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임 기획 스튜디오</title>
  <style>
    :root { --primary: #7c3aed; --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; }
    body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    .card { background-color: var(--panel); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1, h2, h3 { margin-top: 0; color: #c4b5fd; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; box-sizing: border-box; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-right: 8px; margin-bottom: 8px; }
    button:hover { opacity: 0.8; }
    .hidden { display: none !important; }
    .idea-item { background: #0f172a; padding: 16px; border-radius: 8px; margin-bottom: 12px; position: relative; }
    .delete-btn { background-color: #ef4444; padding: 6px 12px; font-size: 0.8rem; position: absolute; right: 16px; top: 16px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎮 AI 게임 기획 스튜디오</h1>

  <div id="loginCard" class="card">
    <h2>개발자 로그인</h2>
    <input type="email" id="emailInput" placeholder="이메일 입력">
    <input type="password" id="passwordInput" placeholder="비밀번호 (6자리 이상)">
    <button id="loginBtn">로그인</button>
    <button id="signupBtn" style="background:#475569;">회원가입</button>
  </div>

  <div id="mainCard" class="hidden">
    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
      <span>접속 계정: <b id="userEmail"></b></span>
      <button id="logoutBtn" style="background:#ef4444; margin:0;">로그아웃</button>
    </div>

    <div class="card">
      <h3>🤖 클로드 AI 기획안 생성</h3>
      <input type="text" id="aiKeyword" placeholder="원하는 게임 컨셉 (예: 사이버펑크 고양이 키우기)">
      <button id="aiBtn">AI 기획 요청</button>
      <button id="ttsBtn" class="hidden" style="background:#10b981;">🔊 기획안 듣기 (TTS)</button>
      <textarea id="aiResult" rows="6" placeholder="AI가 작성한 기획안이 이곳에 나옵니다." readonly></textarea>
      <button id="saveAiBtn" class="hidden" style="background:#3b82f6;">내 보관함에 바로 저장</button>
    </div>

    <div class="card">
      <h3>💾 내 게임 기획 보관함</h3>
      <input type="text" id="dbTitle" placeholder="게임 제목 직접 입력">
      <textarea id="dbContent" rows="3" placeholder="상세 내용 직접 입력"></textarea>
      <button id="saveDbBtn">보관함에 추가</button>
      <div id="dbList" style="margin-top: 20px;"></div>
    </div>
  </div>
</div>

<script type="module">
  // 웹용 최신 Firebase 모듈 불러오기 (수정 완료)
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getDatabase, ref, push, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  // 회원님의 파이어베이스 설정 적용 완료
  const firebaseConfig = {
    apiKey: "AIzaSyBjpo3ZhgLKsl2ZYcYs7yMuF-5VUjrTndE",
    authDomain: "rhkwp-e6ef4.firebaseapp.com",
    projectId: "rhkwp-e6ef4",
    storageBucket: "rhkwp-e6ef4.firebasestorage.app",
    messagingSenderId: "273960470634",
    appId: "1:273960470634:web:9c838ca467f266bfc46213"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // 회원님의 GAS 웹앱 URL 적용 완료
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw5pJSKYjfrarjHsWaay3BbWu2_5c-iliiWGwJBOAn0EFC0X5W2G4_mnSp-uNHswbQH/exec";

  let currentUid = null;

  // --- 로그인 및 회원가입 기능 ---
  document.getElementById('signupBtn').addEventListener('click', async () => {
    const emailVal = document.getElementById('emailInput').value;
    const passwordVal = document.getElementById('passwordInput').value;
    if(!emailVal || !passwordVal) return alert("이메일과 비밀번호를 입력해주세요.");
    
    try { 
      await createUserWithEmailAndPassword(auth, emailVal, passwordVal); 
      alert('회원가입이 완료되었습니다! 이제 로그인해주세요.'); 
    } catch(e) { 
      alert("가입 실패: " + e.message); 
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const emailVal = document.getElementById('emailInput').value;
    const passwordVal = document.getElementById('passwordInput').value;
    if(!emailVal || !passwordVal) return alert("이메일과 비밀번호를 입력해주세요.");

    try { 
      await signInWithEmailAndPassword(auth, emailVal, passwordVal); 
    } catch(e) { 
      alert("로그인 실패. 이메일과 비밀번호를 확인해주세요."); 
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth);
  });

  // --- 로그인 상태 감지 ---
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUid = user.uid;
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('mainCard').classList.remove('hidden');
      document.getElementById('userEmail').innerText = user.email;
      loadDB();
    } else {
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('mainCard').classList.add('hidden');
    }
  });

  // --- AI 생성 요청 ---
  document.getElementById('aiBtn').addEventListener('click', async () => {
    const keyword = document.getElementById('aiKeyword').value;
    if(!keyword) return alert('키워드를 입력하세요.');
    
    const aiResultBox = document.getElementById('aiResult');
    aiResultBox.value = "AI가 게임 기획을 구상 중입니다... (약 10초 정도 소요될 수 있습니다)";
    
    try {
      const res = await fetch(GAS_URL, { 
        method: "POST", 
        body: JSON.stringify({ action: "chat", question: keyword }) 
      });
      const data = await res.json();
      
      aiResultBox.value = data.answer || data.error;
      document.getElementById('ttsBtn').classList.remove('hidden');
      document.getElementById('saveAiBtn').classList.remove('hidden');
    } catch(e) { 
      aiResultBox.value = "서버 오류가 발생했습니다. 에러내용: " + e.message; 
    }
  });

  // --- TTS 기능 ---
  document.getElementById('ttsBtn').addEventListener('click', () => {
    const text = document.getElementById('aiResult').value;
    window.speechSynthesis.cancel(); 
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = 'ko-KR';
    window.speechSynthesis.speak(speech);
  });

  // --- DB 보관함으로 복사 ---
  document.getElementById('saveAiBtn').addEventListener('click', () => {
    document.getElementById('dbTitle').value = document.getElementById('aiKeyword').value + " (AI 기획안)";
    document.getElementById('dbContent').value = document.getElementById('aiResult').value;
  });

  // --- DB 저장 기능 ---
  document.getElementById('saveDbBtn').addEventListener('click', async () => {
    const title = document.getElementById('dbTitle').value;
    const content = document.getElementById('dbContent').value;
    if(!title || !content) return alert('제목과 내용을 모두 입력해주세요.');

    await push(ref(db, `ideas/${currentUid}`), { title: title, content: content });
    document.getElementById('dbTitle').value = '';
    document.getElementById('dbContent').value = '';
  });

  // --- DB 불러오기 ---
  function loadDB() {
    onValue(ref(db, `ideas/${currentUid}`), snapshot => {
      const list = document.getElementById('dbList');
      list.innerHTML = '';
      snapshot.forEach(child => {
        const data = child.val();
        list.innerHTML += `<div class="idea-item">
          <h4>${data.title}</h4>
          <p style="white-space: pre-wrap; color: #cbd5e1; font-size: 0.9rem;">${data.content}</p>
          <button class="delete-btn" data-key="${child.key}">삭제</button>
        </div>`;
      });

      // 삭제 버튼 이벤트 연결
      const deleteBtns = document.querySelectorAll('.delete-btn');
      deleteBtns.forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if(confirm('이 기획안을 삭제하시겠습니까?')) {
            const key =
