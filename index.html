<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase 데이터 관리</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #e3f2fd, #fce4ec); font-family: Arial, sans-serif; color: #333; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
    h2 { text-align: center; margin-top: 0; }
    input { width: 100%; height: 45px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 10px; outline: none; font-size: 15px; }
    button { width: 100%; height: 45px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 10px; transition: 0.2s; }
    button:hover { opacity: 0.8; }
    .btn-login { background: #42a5f5; }
    .btn-signup { background: #7e57c2; }
    .btn-logout { background: #ef5350; }
    .btn-add { background: #66bb6a; }
    .hidden { display: none; }
    .item { background: #f7f9fb; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #eee; }
    .item h4 { margin: 0 0 5px 0; }
    .item p { margin: 0 0 10px 0; color: #555; font-size: 14px; }
    .btn-delete { background: #ef5350; height: 35px; width: 80px; font-size: 13px; margin: 0; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
  
  <div id="loginBox">
    <h2>개발자 로그인</h2>
    <input type="email" id="email" placeholder="이메일 입력 (예: test@test.com)" />
    <input type="password" id="password" placeholder="비밀번호 (6자리 이상)" />
    <button class="btn-login" onclick="doLogin()">로그인</button>
    <button class="btn-signup" onclick="doSignup()">회원가입</button>
    <p id="errorMsg" style="color: red; font-size: 13px; text-align: center;"></p>
  </div>

  <div id="mainBox" class="hidden">
    <h2>내 아이디어 보관함</h2>
    <p style="text-align: center; font-size: 14px;">접속 계정: <strong id="userEmail"></strong></p>
    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
    <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">
    
    <input type="text" id="title" placeholder="아이디어 제목" />
    <input type="text" id="content" placeholder="상세 내용" />
    <button class="btn-add" onclick="doAdd()">저장하기</button>
    
    <div id="dataList" style="margin-top: 20px;"></div>
  </div>

</div>

<script>
  // 1. 회원님의 파이어베이스 설정값
  const firebaseConfig = {
    apiKey: "AIzaSyBjpo3ZhgLKsl2ZYcYs7yMuF-5VUjrTndE",
    authDomain: "rhkwp-e6ef4.firebaseapp.com",
    projectId: "rhkwp-e6ef4",
    storageBucket: "rhkwp-e6ef4.firebasestorage.app",
    messagingSenderId: "273960470634",
    appId: "1:273960470634:web:9c838ca467f266bfc46213",
    databaseURL: "https://rhkwp-e6ef4-default-rtdb.firebaseio.com" // 누락되었던 필수 주소 추가
  };

  // 2. 파이어베이스 실행
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  
  let currentUid = null;

  // --- 로그인 상태 실시간 감지 ---
  auth.onAuthStateChanged(function(user) {
    if (user) {
      currentUid = user.uid;
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('mainBox').classList.remove('hidden');
      document.getElementById('userEmail').innerText = user.email;
      loadData(); // 로그인 성공 시 데이터 불러오기
    } else {
      currentUid = null;
      document.getElementById('loginBox').classList.remove('hidden');
      document.getElementById('mainBox').classList.add('hidden');
      document.getElementById('dataList').innerHTML = '';
    }
  });

  // --- 회원가입 버튼 동작 ---
  function doSignup() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('password').value;
    if(!e || !p) return alert("이메일과 비밀번호를 입력해주세요.");
    
    auth.createUserWithEmailAndPassword(e, p)
      .then(function() { alert("회원가입 완료! 바로 시작합니다."); })
      .catch(function(error) { 
        document.getElementById('errorMsg').innerText = "가입 에러: " + error.message; 
        alert("회원가입 실패!");
      });
  }

  // --- 로그인 버튼 동작 ---
  function doLogin() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('password').value;
    if(!e || !p) return alert("이메일과 비밀번호를 입력해주세요.");
    
    auth.signInWithEmailAndPassword(e, p)
      .catch(function(error) { 
        document.getElementById('errorMsg').innerText = "로그인 에러: " + error.message; 
        alert("이메일이나 비밀번호가 틀렸습니다.");
      });
  }

  // --- 로그아웃 버튼 동작 ---
  function doLogout() {
    auth.signOut();
  }

  // --- 데이터 추가 버튼 동작 ---
  function doAdd() {
    const t = document.getElementById('title').value;
    const c = document.getElementById('content').value;
    if(!t || !c) return alert("제목과 내용을 모두 입력해주세요.");

    db.ref('users/' + currentUid + '/items').push({
      title: t,
      content: c
    }).then(function() {
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
    }).catch(function(error) {
      alert("데이터 저장 실패: " + error.message);
    });
  }

  // --- 데이터 불러오기 동작 ---
  function loadData() {
    db.ref('users/' + currentUid + '/items').on('value', function(snapshot) {
      const list = document.getElementById('dataList');
      list.innerHTML = '';
      
      snapshot.forEach(function(child) {
        const data = child.val();
        list.innerHTML += `
          <div class="item">
            <h4>${data.title}</h4>
            <p>${data.content}</p>
            <button class="btn-delete" onclick="doDelete('${child.key}')">삭제</button>
          </div>
        `;
      });
    });
  }

  // --- 데이터 삭제 동작 ---
  window.doDelete = function(key) {
    if(confirm("이 아이디어를 삭제할까요?")) {
      db.ref('users/' + currentUid + '/items/' + key).remove();
    }
  }
</script>

</body>
</html>
