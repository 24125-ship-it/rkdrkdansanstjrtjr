<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보안 관제 센터 통제 구역 (Claude 전용)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1e38);
      font-family: 'Segoe UI', Arial, sans-serif; color: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
    }
    .wrapper { width: 100%; padding: 20px; display: flex; justify-content: center; }
    
    .auth-container {
      width: 100%; max-width: 420px;
      background: #1e293b; border-radius: 16px; padding: 35px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid #334155; text-align: center;
    }
    .auth-logo { font-size: 50px; margin-bottom: 10px; }
    .auth-container h2 { margin: 0 0 6px; color: #f8fafc; font-size: 24px; }
    .auth-container p { margin: 0 0 24px; color: #94a3b8; font-size: 13px; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }

    .main-container {
      width: min(950px, 100%);
      background: #1e293b; border-radius: 16px; padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); border: 1px solid #334155;
    }
    .main-title { margin: 0 0 6px; text-align: center; font-size: 26px; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
    .main-subtitle { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 13px; }

    input, textarea, select {
      height: 48px; padding: 0 14px; border: 1px solid #475569; border-radius: 8px; 
      font-size: 14px; outline: none; background: #0f172a; color: #f8fafc; transition: 0.2s;
    }
    textarea { height: 120px; padding: 14px; resize: vertical; font-family: monospace; }
    input:focus, textarea:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
    
    button {
      border: none; border-radius: 8px; padding: 0 16px; height: 48px;
      font-size: 15px; cursor: pointer; transition: 0.2s; font-weight: bold;
    }
    button:hover { transform: translateY(-1px); opacity: 0.95; }
    
    .btn-primary { background: #0284c7; color: white; }
    .btn-secondary { background: #334155; color: #cbd5e1; border: 1px solid #475569; }
    .btn-secondary:hover { background: #475569; }
    .btn-action { background: #0ea5e9; color: white; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3); }
    .btn-delete { background: #ef4444; color: white; padding: 4px 12px; height: 32px; font-size: 13px; border-radius: 6px; }
    .btn-logout { background: #475569; color: white; height: 36px; font-size: 13px; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 24px; padding: 12px 20px; border-radius: 10px; background: #0f172a;
      border: 1px solid #334155;
    }
    .user-info { font-size: 14px; color: #cbd5e1; }
    .status { min-height: 20px; margin-bottom: 16px; color: #38bdf8; font-size: 13px; text-align: center; font-family: monospace; }
    
    .ai-form { display: flex; flex-direction: column; gap: 14px; margin-bottom: 30px; }
    .list { display: flex; flex-direction: column; gap: 14px; }
    .item {
      padding: 18px; border-radius: 10px; background: #111827; border: 1px solid #374151;
      display: flex; flex-direction: column; gap: 10px;
    }
    .item-header { display: flex; justify-content: space-between; align-items: center; }
    .item-title { margin: 0; font-size: 15px; font-weight: bold; color: #f43f5e; font-family: monospace; }
    .item-content { 
      margin: 0; color: #e5e7eb; line-height: 1.6; font-size: 14px; white-space: pre-wrap; 
      background: #1f2937; padding: 14px; border-radius: 6px; border-left: 4px solid #38bdf8;
    }
    .item-date { font-size: 12px; color: #9ca3af; font-family: monospace; }
    .btn-play { background: #10b981; color: white; height: 32px; font-size: 13px; padding: 0 10px; border-radius: 6px; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="wrapper">
    
    <section id="authPage" class="auth-container">
      <div class="auth-logo">🛡️</div>
      <h2>보안 관제 시스템</h2>
      <p>Claude AI 인텔리전스 통제 소포트웨어</p>
      
      <div class="auth-form">
        <input id="emailInput" type="email" placeholder="아이디 (이메일 주소)" required />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" required />
        <button type="button" class="btn-primary" id="loginBtn">시스템 접속 (Login)</button>
        <button type="button" class="btn-secondary" id="signupBtn">신규 요원 계정 등록</button>
      </div>
    </section>

    <section id="mainPage" class="main-container hidden">
      <h2 class="main-title">⚡ Cyber Security Control Panel</h2>
      <div class="main-subtitle">Claude 3.5 기반 침해분석 및 음성 브리핑 감사 플랫폼</div>

      <div class="top-bar">
        <div class="user-info">🔑 접속 요원: <span id="userEmail" style="color:#38bdf8; font-weight:bold;"></span></div>
        <button class="btn-logout" id="logoutBtn">접속 종료</button>
      </div>

      <div class="ai-form">
        <label style="font-weight: bold; color: #94a3b8; font-size: 14px;">🔍 분석 데이터 피드 입력 (코드, 로그 또는 질의):</label>
        <textarea id="questionInput" placeholder="Claude가 정밀하게 진단할 악성 스크립트나 보안 위협 데이터를 입력하세요..."></textarea>
        
        <div style="display: flex; justify-content: flex-end;">
          <button class="btn-action" id="askBtn" style="width: 100%; max-width: 300px;">🚨 원격 Claude AI 취약점 진단 가동</button>
        </div>
      </div>

      <div id="status" class="status"></div>

      <h3 style="border-bottom: 2px solid #334155; padding-bottom: 8px; color: #38bdf8; font-size: 16px;">📋 데이터베이스 보관 감사 로그 (Audit Logs)</h3>
      <div id="dataList" class="list"></div>
    </section>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, remove, onValue, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ⚠️ [필수 수정] 내 Firebase 프로젝트 설정 정보로 채워주세요.
    const firebaseConfig = {
      apiKey: "AIzaSyDHltyqIQrpis3gcOeSC1t2EYfCOcQ2dzQ",
      authDomain: "cyber-security-dashboard-81406.firebaseapp.com",
      projectId: "cyber-security-dashboard-81406",
      storageBucket: "cyber-security-dashboard-81406.firebasestorage.app",
      messagingSenderId: "289373333519",
      appId: "1:289373333519:web:4a7d63072423480a04db7a"
    };

    // ⚠️ [필수 수정] 새로 배포한 웹 앱 URL을 여기에 정확히 넣어주세요.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwlDffAzRHI7P2J0-ufatZFa9XxsWlaZk4wpxyy4SmluLESv0Wxkh0SEcD59aPkSgwf5A/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const authPage = document.getElementById('authPage');
    const mainPage = document.getElementById('mainPage');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');
    const questionInput = document.getElementById('questionInput');
    const askBtn = document.getElementById('askBtn');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');

    let currentUser = null;
    let currentItemsRef = null;

    function setStatus(msg) { statusBox.textContent = msg; }

    function getFormValues() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) { alert('이메일과 패스워드를 모두 작성바랍니다.'); return null; }
      return { email, password };
    }

    signupBtn.addEventListener('click', async () => {
      const creds = getFormValues(); if (!creds) return;
      try {
        await createUserWithEmailAndPassword(auth, creds.email, creds.password);
        alert('신규 요원 등록이 성공적으로 완료되었습니다.');
      } catch (err) { alert('등록 실패: ' + err.message); }
    });

    loginBtn.addEventListener('click', async () => {
      const creds = getFormValues(); if (!creds) return;
      try {
        await signInWithEmailAndPassword(auth, creds.email, creds.password);
      } catch (err) { alert('인증에 실패했습니다. 계정 정보를 다시 확인하세요.'); }
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authPage.classList.add('hidden');
        mainPage.classList.remove('hidden');
        document.body.style.alignItems = "flex-start";
        userEmail.textContent = user.email;
        startRealtimeDatabase(user.uid);
      } else {
        currentUser = null;
        mainPage.classList.add('hidden');
        authPage.classList.remove('hidden');
        document.body.style.alignItems = "center";
        stopRealtimeDatabase();
      }
    });

    function startRealtimeDatabase(uid) {
      stopRealtimeDatabase();
      setStatus('[SYSTEM] 보안 서버 원격 동기화 중...');
      currentItemsRef = ref(database, `users/${uid}/security_logs`);
      
      onValue(currentItemsRef, (snapshot) => {
        renderLogs(snapshot.val());
        setStatus('[ONLINE] 실시간 감사 로그망 가동 중');
      });
    }

    function stopRealtimeDatabase() {
      if (currentItemsRef) { off(currentItemsRef); currentItemsRef = null; }
    }

    // AI 호출 및 시스템 처리
    askBtn.addEventListener('click', async () => {
      const question = questionInput.value.trim();
      if (!question) { alert('분석할 원시 데이터를 채워넣으세요.'); return; }

      try {
        askBtn.disabled = true;
        askBtn.textContent = '진단 중...';
        setStatus('[PROCESSING] Claude 위협 분석 코어 작동 중...');

        // 1. 구글 앱스 스크립트를 경유하여 Claude 호출
        const chatRes = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: question })
        });
        const chatData = await chatRes.json();
        if (chatData.error) throw new Error(chatData.error);
        const answer = chatData.answer;

        setStatus('[SPEAKING] 브라우저 TTS 인프라 가동 및 대피령 음성 합성 중...');
        // 2. 브라우저 엔진으로 실시간 음성 브리핑 자동 출력
        speakText(answer);

        setStatus('[SYNC_DATABASE] 정밀 리포트를 감사 노드에 적재 중...');
        // 3. Firebase 실시간 DB에 데이터 업로드
        await push(ref(database, `users/${currentUser.uid}/security_logs`), {
          title: `CLAUDE_ANALYSIS: ${question.substring(0, 15)}...`,
          content: `📥 [입력 데이터]\n${question}\n\n🛡️ [Claude 정밀 분석 리포트]\n${answer}`,
          createdAt: new Date().toLocaleString('ko-KR')
        });

        questionInput.value = '';
        setStatus('[COMPLETE] 감사 인프라에 성공적으로 병합되었습니다.');
      } catch (err) {
        console.error(err);
        setStatus('[FAIL] 시스템 연동 오류');
        alert('요청 처리 오류: ' + err.message);
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = '🚨 원격 Claude AI 취약점 진단 가동';
      }
    });

    // 브라우저 내장 음성 출력 함수 (Web Speech API)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // 이전 음성 취소
        const cleanText = text.replace(/[*#`_\-]/g, ''); // 마크다운 기호 제거
        const speech = new SpeechSynthesisUtterance(cleanText.substring(0, 300)); // 너무 길면 상위 300자만 요약 리딩
        speech.lang = 'ko-KR';
        speech.rate = 1.0; 
        window.speechSynthesis.speak(speech);
      }
    }

    function renderLogs(data) {
      dataList.innerHTML = '';
      if (!data) {
        dataList.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b; font-family:monospace;">[CLEAR] 보관된 감사 로그가 존재하지 않습니다.</div>';
        return;
      }
      const entries = Object.entries(data).reverse();
      entries.forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        
        // 브라우저 재생용 커스텀 스피커 버튼 배치
        div.innerHTML = `
          <div class="item-header">
            <p class="item-title">📟 ${escapeHTML(item.title)}</p>
            <div style="display:flex; gap:8px;">
              <button class="btn-play" onclick="playLogAudio(\`${id}\`)">📢 브리핑 재생</button>
              <button class="btn-delete" onclick="deleteLog('${id}')">소각</button>
            </div>
          </div>
          <p class="item-content" id="content-${id}">${escapeHTML(item.content)}</p>
          <div class="item-date">⏱️ 로그 생성 시간: ${item.createdAt}</div>
        `;
        dataList.appendChild(div);
      });
    }

    // 로그 카드 우측 버튼 클릭 시 다시 소리 내어 읽어주는 함수 전역 등록
    window.playLogAudio = function(id) {
      const contentEl = document.getElementById(`content-${id}`);
      if (contentEl) {
        speakText(contentEl.textContent);
      }
    };

    window.deleteLog = async function(id) {
      if (!currentUser) return;
      if (!confirm('감사 로그 파일 시스템을 영구 소각하시겠습니까?')) return;
      try {
        await remove(ref(database, `users/${currentUser.uid}/security_logs/${id}`));
      } catch (err) { alert('명령 거부'); }
    };

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
